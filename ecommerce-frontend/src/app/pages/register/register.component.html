<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Register</h2>

    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="name" placeholder="Enter name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password">
    </div>

    <button class="auth-btn" (click)="register()">Register</button>

    <p class="auth-footer">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
