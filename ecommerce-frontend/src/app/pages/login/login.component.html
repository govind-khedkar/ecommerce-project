<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Login</h2>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter Email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="password" placeholder="Enter Password">
    </div>

    <p class="error-msg" *ngIf="errorMsg">{{errorMsg}}</p>
    <button class="auth-btn" (click)="login()">Login</button>

    <button class="forgot-btn" (click)="showForgotForm = !showForgotForm">Forgot Password?</button>

    <div *ngIf="showForgotForm" class="forgot-section">

      <h3 class="forgot-title">Forgot Password</h3>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="forgotEmail" placeholder="Enter your email">
      </div>

      <button class="auth-btn" (click)="forgotPassword()">Send Code</button>

      <div *ngIf="code">

        <h3 class="forgot-title">Verify Code</h3>

        <div class="form-group">
          <label>Enter Code</label>
          <input type="text" [(ngModel)]="code" placeholder="Enter verification code">
        </div>

        <button class="auth-btn" (click)="verifyPassword()">Verify Code</button>

        <h3 class="forgot-title">Reset Password</h3>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" [(ngModel)]="newPassword" placeholder="Enter new password">
        </div>

        <button class="auth-btn" (click)="resetPassword()">Reset Password</button>

      </div>
    </div>

    <p class="auth-footer">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
