<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Change Password</h2>

    <div class="form-group">
      <label>Current Password</label>
      <input type="password" [(ngModel)]="currentPassword" placeholder="Enter current password">
    </div>

    <div class="form-group">
      <label>New Password</label>
      <input type="password" [(ngModel)]="newPassword" placeholder="Enter new password">
    </div>

    <p class="success-msg" *ngIf="message && !isError">{{message}}</p>
    <p class="error-msg" *ngIf="message && isError">{{message}}</p>

    <button class="auth-btn" (click)="changePassword()">Change Password</button>
  </div>
</div>
