<div class="admin-orders-container">
  <h2 class="admin-orders-title">All Orders</h2>

  <div class="admin-order-table">
    <div class="admin-order-row header-row">
      <span>Order ID</span>
      <span>Customer</span>
      <span>Email</span>
      <span>Date</span>
      <span>Status</span>
      <span>Update Status</span>
    </div>

    <div class="admin-order-row" *ngFor="let order of orders">
      <span class="order-id">#{{order.id}}</span>
      <span class="order-customer">{{order.user.name}}</span>
      <span class="order-email">{{order.user.email}}</span>
      <span class="order-date">{{order.createdAt | date:'dd MMM yyyy'}}</span>
      <span class="order-status" [ngClass]="order.status.toLowerCase()">{{order.status}}</span>
      <select class="status-select" #statusSelect (change)="changeStatus(order.id, statusSelect.value)">
        <option value="PENDING">Pending</option>
        <option value="PROCESSING">Processing</option>
        <option value="SHIPPED">Shipped</option>
        <option value="DELIVERED">Delivered</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>
  </div>
</div>
