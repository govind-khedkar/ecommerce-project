<div class="form-container">
  <h2 class="form-title">{{ id ? 'Update Product' : 'Add Product' }}</h2>

  <div class="form-group">
    <label>Name</label>
    <input type="text" [(ngModel)]="name" name="name" placeholder="Name">
  </div>

  <div class="form-group">
    <label>Description</label>
    <input type="text" [(ngModel)]="description" name="description" placeholder="Description">
  </div>

  <div class="form-group">
    <label>Price</label>
    <input type="number" [(ngModel)]="price" name="price" placeholder="Price">
  </div>

  <div class="form-group">
    <label>Stock</label>
    <input type="number" [(ngModel)]="stock" name="stock" placeholder="Stock">
  </div>

  <div class="form-group">
    <label>Sub Category</label>
    <select [(ngModel)]="subCategoryId" name="subCategoryId" [disabled]="!!id">
      <option [ngValue]="null" disabled selected>Select SubCategory</option>
      <option *ngFor="let sub of subCategories" [ngValue]="sub.id">
        {{sub.name}}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>Product Image</label>
    <input type="file" (change)="onFileChange($event)">
  </div>

  <p class="error-msg" *ngIf="errorMsg">{{errorMsg}}</p>
  <button class="auth-btn" *ngIf="!id" (click)="addProduct()">Add Product</button>
  <button class="auth-btn" *ngIf="id" (click)="updateProduct()">Update Product</button>
</div>
