<div class="admin-products-container">
  <h2 class="admin-products-title">All Products</h2>

  <div class="admin-product-table">
    <div class="admin-product-row header-row">
      <span>Image</span>
      <span>Name</span>
      <span>Price</span>
      <span>Actions</span>
    </div>

    <div class="admin-product-row" *ngFor="let p of products">
      <img [src]="p.imageUrl" class="admin-product-image" width="100" height="100"/>
      <span class="admin-product-name">{{p.name}}</span>
      <span class="admin-product-price">{{p.price | currency:'INR':'symbol':'1.2-2'}}</span>
      <div class="admin-product-actions">
        <button class="edit-btn" [routerLink]="['/admin/edit-product', p.id]">Edit</button>
        <button class="delete-btn" (click)="deleteProduct(p.id)">Delete</button>
      </div>
    </div>
  </div>
</div>
