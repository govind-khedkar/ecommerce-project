<div class="cart-container">

    <div class="cart-item" *ngFor="let item of cartItems">
        <img [src]="item.product.imageUrl" class="cart-item-image" width="100"
            [routerLink]="['/product', item.product.id]">
        <div class="cart-item-info">
            <h3 class="cart-item-name" [routerLink]="['/product', item.product.id]">{{ item.product.name }}</h3>
            <p class="cart-item-price">Price: {{ item.product.price | currency:'INR':'symbol':'1.2-2' }}</p>

            <div class="cart-item-qty">
                <button (click)="updateQty(item.product.id, item.quantity - 1)">-</button>
                <p>Qty: {{item.quantity}}</p>
                <button (click)="updateQty(item.product.id, item.quantity + 1)">+</button>
            </div>
        </div>

        <button class="remove-btn" (click)="removeItem(item.product.id)">Remove</button>
    </div>

    <div class="cart-checkout" *ngIf="cartItems.length > 0">
        <select [(ngModel)]="paymentMethod" class="payment-select">
            <option value="">Select Payment</option>
            <option value="COD">Cash on Delivery</option>
            <option value="CARD">Card</option>
            <option value="UPI">UPI</option>
        </select>
        <button class="place-order-btn" (click)="placeOrder()">Place Order</button>
    </div>

    <div class="cart-empty" *ngIf="cartItems.length === 0">
        <p>Cart is empty</p>
    </div>

</div>
