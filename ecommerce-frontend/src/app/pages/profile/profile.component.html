<div class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">My Profile</h2>

    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="name" placeholder="Enter name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="Enter email">
    </div>

    <p class="success-msg" *ngIf="message && !isError">{{message}}</p>
    <p class="error-msg" *ngIf="message && isError">{{message}}</p>

    <button class="auth-btn" (click)="updateProfile()">Update Profile</button>
  </div>
</div>
